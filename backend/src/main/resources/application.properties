spring.application.name=apugen-backend

# Configuración del servidor (Render inyecta PORT automáticamente)
server.port=${PORT:8080}

# Conexión a PostgreSQL (acepta DB_URL directa o DB_HOST/DB_PORT/DB_NAME desde Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:embobinados_apu}}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# "update" actualiza el esquema sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logs SQL (activos en local por defecto; desactivables en Render con JPA_SHOW_SQL=false)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Seguridad JWT, Usuario Administrador Inicial y CORS
app.jwt.secret=${APP_JWT_SECRET:APUGenEmbobinadosDevSecretKey2026SuperSecureMinimum32Bytes!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Administrador}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
