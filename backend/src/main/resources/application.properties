spring.application.name=apugen-backend

# Configuración del servidor (Render inyecta PORT automáticamente)
server.port=${PORT:8080}

# Conexión a PostgreSQL (acepta DB_URL directa o DB_HOST/DB_PORT/DB_NAME desde Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:embobinados_apu}}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logs SQL (desactivados por defecto en producción; activables por variable de entorno)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Orígenes CORS permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
