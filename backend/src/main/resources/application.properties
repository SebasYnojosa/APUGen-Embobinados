spring.application.name=apugen-backend

#Configuración del servidor
server.port=8080

#Conexión a postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/embobinados_apu
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# "update" actualiza el esquema sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Opciones para ver las consultas SQL en la consola (muy útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad JWT y Usuario Administrador Inicial
app.jwt.secret=${APP_JWT_SECRET:APUGenEmbobinadosDevSecretKey2026SuperSecureMinimum32Bytes!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Administrador}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

