services:
  # 1. Contenedor de la Base de Datos
  db:
    image: postgres:16-alpine
    container_name: embobinados-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: embobinados_apu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Esto guarda tus datos permanentemente

  # 2. Contenedor del Visualizador Web (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: embobinados-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@embobinados.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # El visualizador estará en el puerto 5050
    depends_on:
      - db # Espera a que la BD inicie primero

  # ==========================================
  # 3. BACKEND Y FRONTEND (Comentados para Dev)
  # ==========================================
  # Nota: En desarrollo es mejor correr estos servicios con tu terminal local 
  # para mantener la recarga automática (hot-reload). Para producción o pruebas, 
  # necesitarías un Dockerfile en cada carpeta y descomentar esto:
  #
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - db
  #
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  postgres_data: # Define el volumen para persistencia de datos
