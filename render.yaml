databases:
  - name: apu-gen-db
    databaseName: embobinados_apu
    user: apugen_user
    plan: free

services:
  - type: web
    name: apu-gen-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/apus
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: apu-gen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: apu-gen-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: apu-gen-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: apu-gen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: apu-gen-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173
      - key: JPA_SHOW_SQL
        value: "false"

  - type: web
    name: apu-gen-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: apu-gen-backend
          envVarKey: RENDER_EXTERNAL_URL
